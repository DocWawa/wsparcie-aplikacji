<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikacje - pomoc techniczna</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f7fb; --text: #1b1b2b; --muted: #6b6b7b; --border: #e2e0ea; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    main { width: min(640px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
    h1 { margin: 0 0 32px; font-size: clamp(32px, 7vw, 48px); line-height: 1.2; }
    a.app { display: block; padding: 22px 0; border-top: 1px solid var(--border); color: inherit; text-decoration: none; }
    a.app strong { font-size: 22px; }
    a.app span { display: block; color: var(--muted); }
    footer { padding-top: 22px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e14; --text: #f5f5fa; --muted: #a8a8b8; --border: #2c2c3a; } }
  </style>
</head>
<body>
  <main>
    <h1>Pomoc techniczna aplikacji</h1>
    <a class="app" href="skarbnik/"><strong>Skarbnik – Rada Rodziców</strong><span>Zbiórki i rozliczenia Rady Rodziców</span></a>
    <a class="app" href="szamka/"><strong>Szamka</strong><span>Pomoc techniczna aplikacji</span></a>
    <footer>© 2026 Oleksandr Tykhonenko</footer>
  </main>
</body>
</html>
